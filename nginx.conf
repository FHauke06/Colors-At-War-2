server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints these, so they're safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx' mime.types kennt .webmanifest nicht - ohne das käme es als application/octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Session server, reached by the client as same-origin ws(s)://<host>/ws.
    location /ws {
        proxy_pass http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Single-page app: any unmatched path falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
