<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colors at War 2</title>
    <meta name="description" content="Colors at War 2 – Rundenstrategie um Gebiete, Bündnisse und Vorherrschaft." />
    <meta name="theme-color" content="#f0ebdc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191812" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Applied synchronously, before first paint, so a saved dark-mode preference never flashes
      // the default light theme first.
      if (localStorage.getItem('colors-at-war-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
